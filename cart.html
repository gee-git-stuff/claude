<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — My Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <header>
    <nav class="nav">
      <div class="container nav-inner">
        <a href="index.html" class="nav-logo" id="nav-store-name">My Store</a>
        <div class="nav-actions">
          <a href="cart.html" class="btn-cart" aria-label="View cart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            Cart
            <span class="cart-badge" id="cart-count">0</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>Your Cart</h1>
      </div>

      <!-- Empty state -->
      <div class="empty-cart hidden" id="empty-cart">
        <h2>Your cart is empty</h2>
        <p>Add some products to get started.</p>
        <a href="index.html" class="btn-back-shop">Browse Products</a>
      </div>

      <!-- Cart layout (items + summary) -->
      <div class="cart-layout" id="cart-layout">
        <!-- Cart items -->
        <div class="cart-items" id="cart-items">
          <!-- Rendered by store.js -->
        </div>

        <!-- Order summary -->
        <aside class="order-summary">
          <h3>Order Summary</h3>

          <div class="summary-row">
            <span>Subtotal (<span id="summary-count">0</span> items)</span>
            <span id="summary-subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span id="summary-shipping">Calculated at checkout</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="summary-total">$0.00</span>
          </div>

          <button class="btn-checkout" id="checkout-btn" disabled>
            Proceed to Checkout
          </button>

          <p class="secure-note">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Secure checkout via Stripe
          </p>

          <a href="index.html" style="display:block; text-align:center; margin-top:16px; font-size:.85rem; color:var(--text-muted);">
            &larr; Continue Shopping
          </a>
        </aside>
      </div>
    </div>
  </main>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container">
      <p>My Store &mdash; Payments secured by <a href="https://stripe.com" target="_blank" rel="noopener">Stripe</a></p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/inventory.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
