<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">My Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <header>
    <nav class="nav">
      <div class="container nav-inner">
        <a href="/" class="nav-logo" id="nav-store-name">My Store</a>

        <div class="nav-links" id="nav-links">
          <!-- Rendered by page-renderer.js -->
        </div>

        <div class="nav-search">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search products..." aria-label="Search products">
        </div>

        <div class="nav-actions">
          <a href="cart.html" class="btn-cart" id="cart-btn" aria-label="View cart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            Cart
            <span class="cart-badge" id="cart-count">0</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <!-- ===== PAGE CONTENT (rendered from blocks) ===== -->
  <main id="page-main"></main>

  <!-- ===== PRODUCT MODAL ===== -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-product-name">
    <div class="modal-wrap">
      <button class="btn-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal" id="modal">
        <img class="modal-image" id="modal-img" src="" alt="">
        <div class="modal-body">
          <p class="modal-category" id="modal-category"></p>
          <h2 id="modal-product-name"></h2>
          <p class="modal-details" id="modal-details"></p>
          <div class="modal-footer">
            <div>
              <div class="modal-price" id="modal-price"></div>
              <div class="modal-stock" id="modal-stock"></div>
            </div>
            <button class="btn-modal-add" id="modal-add-btn">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container">
      <p id="footer-text">My Store &mdash; Payments secured by <a href="https://stripe.com" target="_blank" rel="noopener">Stripe</a></p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/inventory.js"></script>
  <script src="js/store.js"></script>
  <script src="js/page-renderer.js"></script>
</body>
</html>
