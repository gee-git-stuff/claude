<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MealOrganizer — Smart Meal Planner &amp; Grocery List</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1>MealOrganizer</h1>
      <p class="subtitle">Plan meals, manage recipes, track groceries &amp; prices</p>
    </header>

    <nav id="tab-bar">
      <button class="tab-btn active" data-tab="chat">Chat</button>
      <button class="tab-btn" data-tab="meals">Meal Plan</button>
      <button class="tab-btn" data-tab="recipes">Recipes</button>
      <button class="tab-btn" data-tab="groceries">Groceries</button>
      <button class="tab-btn" data-tab="prices">Prices</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>

    <!-- ===== Chat Tab ===== -->
    <div id="tab-chat" class="tab-panel active">
      <div id="chat-messages" class="chat-messages"></div>
      <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" placeholder="Type a command or say 'help'..." autocomplete="off">
        <button type="submit" id="chat-send" class="btn-primary">Send</button>
      </form>
    </div>

    <!-- ===== Meal Plan Tab ===== -->
    <div id="tab-meals" class="tab-panel">
      <div class="panel-header">
        <h2>Weekly Meal Plan</h2>
        <span id="meal-summary" class="muted"></span>
      </div>
      <div id="meal-grid" class="meal-grid"></div>
    </div>

    <!-- ===== Recipes Tab ===== -->
    <div id="tab-recipes" class="tab-panel">
      <div class="panel-header">
        <h2 id="recipe-form-title">Add Recipe</h2>
      </div>
      <form id="recipe-form" class="recipe-form">
        <div class="form-row">
          <div class="form-group">
            <label for="recipe-name">Name</label>
            <input type="text" id="recipe-name" required placeholder="Recipe name">
          </div>
          <div class="form-group">
            <label for="recipe-category">Category</label>
            <select id="recipe-category">
              <option>Breakfast</option><option>Lunch</option><option selected>Dinner</option>
              <option>Snack</option><option>Dessert</option><option>Side</option>
              <option>Drink</option><option>Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="recipe-servings">Servings</label>
            <input type="number" id="recipe-servings" value="4" min="1">
          </div>
          <div class="form-group">
            <label for="recipe-prep">Prep Time</label>
            <input type="text" id="recipe-prep" placeholder="e.g. 15 min">
          </div>
          <div class="form-group">
            <label for="recipe-cook">Cook Time</label>
            <input type="text" id="recipe-cook" placeholder="e.g. 30 min">
          </div>
        </div>
        <div class="form-group">
          <label for="recipe-ingredients">Ingredients (one per line, e.g. "2 cups flour")</label>
          <textarea id="recipe-ingredients" rows="6" placeholder="2 cups flour&#10;1 tsp salt&#10;3 cloves garlic"></textarea>
        </div>
        <div class="form-group">
          <label for="recipe-instructions">Instructions</label>
          <textarea id="recipe-instructions" rows="4" placeholder="Step-by-step instructions..."></textarea>
        </div>
        <div class="form-group">
          <label for="recipe-tags">Tags (comma-separated)</label>
          <input type="text" id="recipe-tags" placeholder="quick, vegetarian, family">
        </div>
        <div class="form-actions">
          <button type="submit" id="recipe-submit-btn" class="btn-primary">Save Recipe</button>
          <button type="button" id="recipe-cancel" class="btn-secondary">Cancel</button>
        </div>
      </form>

      <div class="import-section">
        <h3>Import Recipe from Text</h3>
        <textarea id="recipe-import-text" rows="4" placeholder="Paste recipe text or a recipe from a website here..."></textarea>
        <button id="recipe-import-btn" class="btn-secondary">Import</button>
      </div>

      <h2>Your Recipes</h2>
      <div id="recipe-list"></div>
    </div>

    <!-- ===== Grocery List Tab ===== -->
    <div id="tab-groceries" class="tab-panel">
      <div class="panel-header">
        <h2>Grocery List</h2>
        <span id="grocery-stats" class="muted"></span>
      </div>
      <form id="grocery-add-form" class="inline-form">
        <input type="text" id="grocery-add-input" placeholder="Add an item...">
        <button type="submit" class="btn-primary">Add</button>
        <button type="button" id="grocery-generate" class="btn-secondary">Generate from Meal Plan</button>
        <button type="button" id="grocery-clear-checked" class="btn-secondary">Clear Checked</button>
      </form>
      <div id="sale-alerts"></div>
      <div id="grocery-items"></div>
    </div>

    <!-- ===== Prices Tab ===== -->
    <div id="tab-prices" class="tab-panel">
      <div class="panel-header">
        <h2>Price Tracking</h2>
        <span id="spending-summary" class="muted"></span>
      </div>

      <div class="price-forms">
        <div class="form-card">
          <h3>Log a Price</h3>
          <form id="price-log-form" class="inline-form-vertical">
            <input type="text" id="price-item" placeholder="Item name" required>
            <input type="number" id="price-amount" placeholder="Price" step="0.01" required>
            <input type="text" id="price-store" placeholder="Store name">
            <button type="submit" class="btn-primary">Log Price</button>
          </form>
        </div>
        <div class="form-card">
          <h3>Add a Sale</h3>
          <form id="sale-form" class="inline-form-vertical">
            <input type="text" id="sale-item" placeholder="Item name" required>
            <input type="number" id="sale-price" placeholder="Sale price" step="0.01" required>
            <input type="text" id="sale-store" placeholder="Store name">
            <input type="date" id="sale-until" title="Valid until">
            <button type="submit" class="btn-primary">Add Sale</button>
          </form>
        </div>
      </div>

      <h3>Price History</h3>
      <div id="tracked-prices"></div>

      <h3>Active Sales</h3>
      <div id="active-sales"></div>
    </div>

    <!-- ===== Settings Tab ===== -->
    <div id="tab-settings" class="tab-panel">
      <h2>Settings</h2>
      <form id="settings-form" class="settings-form">
        <div class="form-group">
          <label for="setting-household">Household Size</label>
          <input type="number" id="setting-household" value="2" min="1">
        </div>
        <div class="form-group">
          <label for="setting-budget">Weekly Budget</label>
          <input type="number" id="setting-budget" value="150" step="1">
        </div>
        <div class="form-group">
          <label for="setting-currency">Currency Symbol</label>
          <input type="text" id="setting-currency" value="$" maxlength="3">
        </div>
        <button type="submit" class="btn-primary">Save Settings</button>
      </form>

      <div class="data-section">
        <h3>Data Management</h3>
        <button id="export-data" class="btn-secondary">Export All Data</button>
        <label class="btn-secondary file-label">
          Import Data
          <input type="file" id="import-data" accept=".json" hidden>
        </label>
      </div>
    </div>

    <!-- ===== Meal Picker Modal ===== -->
    <div id="meal-picker-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Pick a Meal</h3>
          <button id="meal-picker-close" class="btn-icon">&times;</button>
        </div>
        <input type="text" id="meal-picker-search" placeholder="Search recipes...">
        <div id="meal-picker-list" class="picker-list"></div>
        <div class="picker-custom">
          <input type="text" id="meal-picker-custom" placeholder="Or type a custom meal...">
          <button id="meal-picker-add-custom" class="btn-primary">Add</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/meals.js"></script>
  <script src="js/groceries.js"></script>
  <script src="js/prices.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
